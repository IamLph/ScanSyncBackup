services:
  migration:
    build:
      context: .
      dockerfile: Dockerfile
    image: scan-sync-backup:latest
    restart: always
    init: true
    stop_grace_period: 30s
    ports:
      # 宿主机端口:容器端口；修改左边的 5080 即可更换访问端口。
      - "5080:80"
    environment:
      VIEW_HOST: "0.0.0.0"
      VIEW_PORT: "80"
      VIEW_STATE_DIR: /app/data
      VIEW_DATABASE_PATH: /app/data/backup_state.db
      # 修改路径时，同时修改下方对应的 source 和 target。
      VIEW_SOURCE_PATH: "/files"
      VIEW_DISK_PATH: "/mnt/files"
    volumes:
      - type: bind
        source: ./data
        target: /app/data
      - type: bind
        source: /files
        target: /files
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/files
        target: /mnt/files
        bind:
          create_host_path: false
      - type: bind
        source: ./ssh
        target: /root/.ssh
